<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Seattle Sim Center | Coming Soon</title>
<meta name="description" content="Seattle Sim Center is preparing for launch. Check back soon." />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a0e17'/%3E%3Cpath d='M50 15 L58 45 L88 50 L58 55 L50 85 L42 55 L12 50 L42 45 Z' fill='%2300e5ff'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0e17;
    --text: #eef1f7;
    --text-dim: #9aa4b8;
    --text-faint: #6b7488;
    --accent: #00e5ff;
    --accent-2: #7c5cff;
    --border: rgba(255, 255, 255, 0.1);
    --gradient-brand: linear-gradient(135deg, var(--accent), var(--accent-2));
    --font-display: "Space Grotesk", system-ui, sans-serif;
    --font-body: "Inter", system-ui, -apple-system, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }
  .glow {
    position: absolute;
    inset: -20% -10% auto -10%;
    height: 700px;
    background: radial-gradient(circle at 50% 20%, rgba(0, 229, 255, 0.16), transparent 60%);
    pointer-events: none;
  }
  .grid-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, black 30%, transparent 100%);
  }
  main {
    position: relative;
    z-index: 1;
    max-width: 560px;
    text-align: center;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 56px;
  }
  .brand-mark { width: 26px; height: 26px; }
  .brand-text {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 0.92rem;
    letter-spacing: 0.06em;
  }
  .brand-accent { color: var(--accent); }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    color: var(--accent);
    margin-bottom: 22px;
  }
  .eyebrow .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  h1 {
    font-family: var(--font-display);
    font-size: clamp(2rem, 5vw, 2.9rem);
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin: 0 0 20px;
  }
  .text-gradient {
    background: var(--gradient-brand);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p.sub {
    color: var(--text-dim);
    font-size: 1.05rem;
    line-height: 1.6;
    margin: 0 auto;
    max-width: 440px;
  }
  .divider {
    width: 100%;
    height: 1px;
    background: var(--border);
    margin: 40px 0;
  }
  .footnote {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    color: var(--text-faint);
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; }
  }
</style>
</head>
<body>

<div class="grid-overlay" aria-hidden="true"></div>
<div class="glow" aria-hidden="true"></div>

<main>
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 10 L59 44 L92 50 L59 56 L50 90 L41 56 L8 50 L41 44 Z" fill="url(#gradMark)"/>
        <defs>
          <linearGradient id="gradMark" x1="8" y1="10" x2="92" y2="90" gradientUnits="userSpaceOnUse">
            <stop stop-color="#00e5ff"/>
            <stop offset="1" stop-color="#7c5cff"/>
          </linearGradient>
        </defs>
      </svg>
    </span>
    <span class="brand-text">SEATTLE<span class="brand-accent">SIM</span>CENTER</span>
  </div>

  <p class="eyebrow"><span class="dot"></span>PRE-FLIGHT CHECKLIST IN PROGRESS</p>

  <h1>We're finishing our <span class="text-gradient">final checks.</span></h1>

  <p class="sub">Seattle Sim Center's new site is almost ready for takeoff. We're putting the finishing touches on everything before we open the hangar doors &mdash; check back soon.</p>

  <div class="divider"></div>

  <p class="footnote">SEATTLE, WA</p>
</main>

</body>
</html>
